# First Line — single web service (API + static UI)
# Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: first-line
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
      # Providers (override in the Render dashboard for live keys)
      - key: AI_PROVIDER
        value: gemini
      - key: VOICE_PROVIDER
        value: elevenlabs
      - key: MEMORY_PROVIDER
        value: backboard
      - key: REPO_PROVIDER
        value: postgres
      # Secrets — set in dashboard (sync: false = do not commit values)
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_DEFAULT_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_SCORER_MODEL
        value: gemini-3.8-flash
